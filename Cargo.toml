[package]
name = "NOS-GNS3-benchmark"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"

[dependencies]
tokio = { version = "1.53.2",features = ["rt", "rt-multi-thread", "macros", "time"]}
tokio-util = { version = "0.7.19", features = ["rt"] }
futures = "0.3.34"

gns3fy-rs = "0.2.2"

serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
serde_json = "1.0.151"

dotenv = "0.15.0"
rust-ini = "0.21.3"

cidr = { version = "0.3.2", features = ["serde"] }
rexpect = "0.7.1"

clap = { version = "4.6.7", features = ["derive", "color"] }
clap-verbosity-flag = { version = "3.0.4", features = ["tracing"] }

anyhow = "1.0.104"
expanduser = "1.2.2"
once_cell = "1.21.4"
strum = { version = "0.28.0", features = ["derive", "strum_macros"] }
indexmap = { version = "2.14.2", features = ["serde"] }
walkdir = "2.5.0"
ctrlc = "3.5.2"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["chrono", "fmt"] }
tracing-appender = "0.2.5"