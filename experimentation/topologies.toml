[Simple]
    supported_routing_protocols = ["static", "RIP", "OSPF"]

    [Simple.network]
    physical_links = [
        { node_a = "Client", adapter_a = 0, node_b = "Router", adapter_b = 3 },
        { node_a = "Server", adapter_a = 0, node_b = "Router", adapter_b = 4 },
    ]

    [Simple.network.nodes.Client]
    vcpu = 2
    ram = 2048
    ip = "10.0.1.2/24"
    x = -200
    y = 0

    [Simple.network.nodes.Server]
    vcpu = 2
    ram = 2048
    ip = "10.0.2.2/24"
    x = 200
    y = 0

    [Simple.network.nodes.Router]
    number_nics = 6
    ips = { 3 = "10.0.1.1/24", 4 = "10.0.2.1/24" }
    x = 0
    y = 5
    routes_config = {
        static = [
            { distant_network = "10.0.1.0/24", gateway = "10.0.1.1", interface = 3 },
            { distant_network = "10.0.2.0/24", gateway = "10.0.2.1", interface = 4 },
        ],

        RIP = {
            interfaces_to_enable = [3, 4],
            networks_to_add = ["10.0.1.0/24", "10.0.2.0/24"]
        },


        OSPF = {
            router_id = "1.1.1.1",
            areas_to_add = {
                0 = [3, 4]
            },
            networks_to_add = [
                { network = "10.0.1.0/24", area = 0 },
                { network = "10.0.2.0/24", area = 0 }
            ]
        }
    }

[Double]
    supported_routing_protocols = ["static", "RIP", "OSPF", "BGP"]

    [Double.network]
    physical_links = [
        { node_a = "Client", adapter_a = 0, node_b = "Router 1", adapter_b = 3 },
        { node_a = "Router 1", adapter_a = 4, node_b = "Router 2", adapter_b = 3 },
        { node_a = "Server", adapter_a = 0, node_b = "Router 2", adapter_b = 4 },
    ]

    [Double.network.nodes.Client]
    vcpu = 2
    ram = 2048
    ip = "10.0.1.2/24"
    x = -300
    y = 0

    [Double.network.nodes.Server]
    vcpu = 2
    ram = 2048
    ip = "10.0.3.2/24"
    x = 300
    y = 0

    [Double.network.nodes."Router 1"]
    number_nics = 6
    ips = { 3 = "10.0.1.1/24", 4 = "10.0.2.1/24" }
    x = -100
    y = 5
    routes_config = {
        static = [
            { distant_network = "10.0.3.0/24", gateway = "10.0.2.2", interface = 4 },
        ],

        RIP = {
            interfaces_to_enable = [3, 4],
            networks_to_add = ["10.0.1.0/24", "10.0.2.0/24"]
        },
        OSPF = {
            router_id = "1.1.1.1",
            areas_to_add = {
                0 = [3, 4]
            },
            networks_to_add = [
                { network = "10.0.1.0/24", area = 0 },
                { network = "10.0.2.0/24", area = 0 }
            ]
        },
        BGP = {
            local_as = 1,
            neighbors = [
                { address = "10.0.2.2", remote_as = 2 }
            ],
            networks_to_advertise = ["10.0.1.0/24"]
        }
    }

    [Double.network.nodes."Router 2"]
    number_nics = 6
    ips = { 3 = "10.0.2.2/24", 4 = "10.0.3.1/24" }
    x = 100
    y = 5
    routes_config = {
        static = [
            { distant_network = "10.0.1.0/24", gateway = "10.0.2.1", interface = 3 },
        ],

        RIP = {
            interfaces_to_enable = [3, 4],
            networks_to_add = ["10.0.2.0/24", "10.0.3.0/24"]
        },
        OSPF = {
            router_id = "2.2.2.2",
            areas_to_add = {
                0 = [3, 4]
            },
            networks_to_add = [
                { network = "10.0.2.0/24", area = 0 },
                { network = "10.0.3.0/24", area = 0 }
            ]
        },
        BGP = {
            local_as = 2,
            neighbors = [
                { address = "10.0.2.1", remote_as = 1 }
            ],
            networks_to_advertise = ["10.0.3.0/24"]
        }
    }